<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Eoncyrus — cyber silver signal</title>
  <desc id="desc">A light cyber-technical banner showing code, markets, and long-horizon decisions moving through a small systems loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5fb"/>
      <stop offset="1" stop-color="#e8f1f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#0f9d91"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#596579" stroke-opacity=".07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#596579"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="30" fill="url(#bg)" stroke="#d0c8df" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="396" rx="29" fill="url(#grid)"/>
  <path d="M2 326C208 269 346 370 536 314S878 203 1278 259" fill="none" stroke="url(#accent)" stroke-opacity=".2" stroke-width="2"/>
  <path d="M2 328C208 271 346 372 536 316S878 205 1278 261" fill="none" stroke="#2563eb" stroke-opacity=".09" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="72" y="72" fill="#6b7280" font-size="16" letter-spacing="1">eoncyrus-lab / cyber-silver</text>
    <text x="70" y="166" fill="#222337" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="750" letter-spacing="3">EONCYRUS</text>
    <text x="74" y="214" fill="#4b5563" font-size="22">code for noisy markets</text>
    <rect x="74" y="245" width="498" height="2" fill="url(#accent)"/>
    <text x="74" y="286" fill="#2563eb" font-size="15" letter-spacing="1">CODE</text>
    <text x="160" y="286" fill="#0f9d91" font-size="15" letter-spacing="1">MARKETS</text>
    <text x="292" y="286" fill="#b42375" font-size="15" letter-spacing="1">SIGNALS</text>
    <text x="74" y="333" fill="#6b7280" font-size="14">agents · research · compound</text>
  </g>

  <g transform="translate(736 72)">
    <rect x="0" y="0" width="472" height="254" rx="24" fill="#ffffff" fill-opacity=".82" stroke="#d0c8df"/>
    <path d="M30 54H442M30 112H442M30 170H442" stroke="#596579" stroke-opacity=".1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="30" y="30" fill="#6b7280" letter-spacing="1">BUILD / READ / COMPOUND</text>
      <rect x="30" y="72" width="100" height="46" rx="12" fill="#f0f7ff" stroke="#2563eb" stroke-width="2"/>
      <text x="80" y="100" text-anchor="middle" fill="#2563eb">BUILD</text>
      <rect x="185" y="72" width="100" height="46" rx="12" fill="#effcf9" stroke="#0f9d91" stroke-width="2"/>
      <text x="235" y="100" text-anchor="middle" fill="#0f9d91">READ</text>
      <rect x="340" y="72" width="102" height="46" rx="12" fill="#fff1fb" stroke="#b42375" stroke-width="2"/>
      <text x="391" y="100" text-anchor="middle" fill="#b42375">COMPOUND</text>
      <path d="M130 95H181M285 95H336" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/>
      <circle cx="83" cy="176" r="7" fill="#2563eb"/>
      <circle cx="235" cy="176" r="7" fill="#0f9d91"/>
      <circle cx="391" cy="176" r="7" fill="#b42375"/>
      <path d="M90 176H228M242 176H384" stroke="#596579" stroke-opacity=".6" stroke-width="2"/>
      <text x="30" y="216" fill="#6b7280">ship</text>
      <text x="204" y="216" fill="#6b7280">study</text>
      <text x="368" y="216" fill="#6b7280">compound</text>
    </g>
  </g>
</svg>
