<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Eoncyrus — quiet investor's desk</title>
  <desc id="desc">A light editorial banner for long-horizon investing built on primary sources, independent judgment, and patient compounding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ee"/>
      <stop offset="1" stop-color="#eef1ec"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#916300"/>
      <stop offset="0.52" stop-color="#3e705e"/>
      <stop offset="1" stop-color="#855a70"/>
    </linearGradient>
    <pattern id="paper" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#706960" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="30" fill="url(#bg)" stroke="#d8d0c4" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="396" rx="29" fill="url(#paper)"/>
  <path d="M2 330C212 276 378 358 576 314S930 222 1278 270" fill="none" stroke="url(#rule)" stroke-opacity=".15" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="72" y="72" fill="#706960" font-size="20" letter-spacing="1.4">EONCYRUS / INVESTOR'S DESK</text>
    <text x="70" y="164" fill="#26231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="74" font-weight="750" letter-spacing="3">EONCYRUS</text>
    <text x="74" y="214" fill="#4f4942" font-size="24">long-horizon investment research</text>
    <rect x="74" y="245" width="510" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="74" y="294" fill="#26231f" font-size="20">read deeply · think independently · compound patiently</text>
    <text x="74" y="342" fill="#706960" font-size="18">software is infrastructure for the process</text>
  </g>

  <g transform="translate(760 60)">
    <rect x="0" y="0" width="446" height="280" rx="24" fill="#fffcf6" fill-opacity=".88" stroke="#d8d0c4"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="30" y="40" fill="#706960" font-size="18" letter-spacing="1.3">INVESTMENT PROCESS</text>
      <path d="M30 60H416" stroke="#d8d0c4"/>
      <circle cx="46" cy="98" r="7" fill="#916300"/>
      <text x="72" y="105" fill="#26231f" font-size="20">01  PRIMARY SOURCES</text>
      <text x="72" y="130" fill="#706960" font-size="16">read the original record</text>
      <circle cx="46" cy="168" r="7" fill="#3e705e"/>
      <text x="72" y="175" fill="#26231f" font-size="20">02  INDEPENDENT JUDGMENT</text>
      <text x="72" y="200" fill="#706960" font-size="16">compare, question, revisit</text>
      <circle cx="46" cy="238" r="7" fill="#855a70"/>
      <text x="72" y="245" fill="#26231f" font-size="20">03  PATIENT COMPOUNDING</text>
    </g>
  </g>
</svg>
