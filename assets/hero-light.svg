<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Eoncyrus — quiet compounding</title>
  <desc id="desc">A light editorial research banner showing primary sources becoming a thesis, judgment, and long-term compounding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#eef1ed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6200"/>
      <stop offset="0.5" stop-color="#2f7d63"/>
      <stop offset="1" stop-color="#8c3f4d"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#665f55" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#665f55"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="30" fill="url(#bg)" stroke="#d8d1c4" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="396" rx="29" fill="url(#grid)"/>
  <path d="M2 326C208 269 346 370 536 314S878 203 1278 259" fill="none" stroke="url(#accent)" stroke-opacity=".2" stroke-width="2"/>
  <path d="M2 328C208 271 346 372 536 316S878 205 1278 261" fill="none" stroke="#9a6200" stroke-opacity=".08" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="72" y="72" fill="#665f55" font-size="16" letter-spacing="1">eoncyrus-lab / quiet-compounding</text>
    <text x="70" y="166" fill="#25241f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="750" letter-spacing="3">EONCYRUS</text>
    <text x="74" y="214" fill="#4f4b43" font-size="22">primary sources for long-term thinking</text>
    <rect x="74" y="245" width="498" height="2" fill="url(#accent)"/>
    <text x="74" y="286" fill="#9a6200" font-size="15" letter-spacing="1">SOURCES</text>
    <text x="171" y="286" fill="#2f7d63" font-size="15" letter-spacing="1">THESIS</text>
    <text x="292" y="286" fill="#8c3f4d" font-size="15" letter-spacing="1">JUDGMENT</text>
    <text x="74" y="333" fill="#665f55" font-size="14">investing · research · tools</text>
  </g>

  <g transform="translate(736 72)">
    <rect x="0" y="0" width="472" height="254" rx="24" fill="#fffdf8" fill-opacity=".86" stroke="#d8d1c4"/>
    <path d="M30 54H442M30 112H442M30 170H442" stroke="#665f55" stroke-opacity=".09"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="30" y="30" fill="#665f55" letter-spacing="1">READ / THINK / COMPOUND</text>
      <rect x="30" y="72" width="100" height="46" rx="12" fill="#fff8e7" stroke="#9a6200" stroke-width="2"/>
      <text x="80" y="100" text-anchor="middle" fill="#9a6200">SOURCES</text>
      <rect x="185" y="72" width="100" height="46" rx="12" fill="#eef7f2" stroke="#2f7d63" stroke-width="2"/>
      <text x="235" y="100" text-anchor="middle" fill="#2f7d63">THESIS</text>
      <rect x="340" y="72" width="102" height="46" rx="12" fill="#fbf0f2" stroke="#8c3f4d" stroke-width="2"/>
      <text x="391" y="100" text-anchor="middle" fill="#8c3f4d">JUDGMENT</text>
      <path d="M130 95H181M285 95H336" stroke="#665f55" stroke-width="2" marker-end="url(#arrow)"/>
      <circle cx="83" cy="176" r="7" fill="#9a6200"/>
      <circle cx="235" cy="176" r="7" fill="#2f7d63"/>
      <circle cx="391" cy="176" r="7" fill="#8c3f4d"/>
      <path d="M90 176H228M242 176H384" stroke="#665f55" stroke-opacity=".6" stroke-width="2"/>
      <text x="30" y="216" fill="#665f55">read</text>
      <text x="204" y="216" fill="#665f55">compare</text>
      <text x="368" y="216" fill="#665f55">compound</text>
    </g>
  </g>
</svg>
