  <path d="M72 179c-5-28 4-57 18-77" stroke="#f3dedb" stroke-width="20" stroke-linecap="round"/>
  <path d="M286 179c5-28-4-57-18-77" stroke="#f3dedb" stroke-width="20" stroke-linecap="round"/>
  <path d="M81 97l8-13 7 15m164 0 8-15 8 14" fill="none" stroke="#f3dedb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

