  <path d="M18 16v28M18 16h22M18 30h17M18 44h22" stroke="#f0f6fc" stroke-width="5" stroke-linecap="round"/>
  <circle cx="54" cy="14" r="4" fill="#79c0ff"/>
</g>

<text x="138" y="79" fill="#57606a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">eoncyrus-lab / profile</text>
<text x="66" y="174" fill="#1f2328" font-family="Inter,system-ui,sans-serif" font-size="76" font-weight="760" letter-spacing="3">EONCYRUS</text>
<text x="70" y="222" fill="#57606a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">building tools to understand noisy systems.</text>
<rect x="70" y="252" width="520" height="2" fill="url(#accent)" opacity=".8"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
