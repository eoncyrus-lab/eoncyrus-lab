  <text x="122" y="303" text-anchor="middle" fill="#79c0ff">SYSTEMS</text>
  <rect x="186" y="280" width="96" height="36" rx="18" fill="#f6f8fa" stroke="#39c5cf"/>
  <text x="234" y="303" text-anchor="middle" fill="#56d4c8">AGENTS</text>
  <rect x="294" y="280" width="104" height="36" rx="18" fill="#f6f8fa" stroke="#a371f7"/>
  <text x="346" y="303" text-anchor="middle" fill="#d2a8ff">MARKETS</text>
  <rect x="410" y="280" width="150" height="36" rx="18" fill="#f6f8fa" stroke="#d29922"/>
  <text x="485" y="303" text-anchor="middle" fill="#e3b341">INFORMATION</text>
</g>

<text x="70" y="366" fill="#57606a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">code · research · automate · repeat</text>

<!-- right character panel -->
