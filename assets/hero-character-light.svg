  <rect x="0" y="0" width="382" height="372" rx="44" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="24" y="24" width="334" height="324" rx="34" fill="#f6f8fa"/>
  <circle cx="178" cy="165" r="134" fill="#dff2ff" opacity=".035"/>

