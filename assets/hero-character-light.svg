  <path d="M96 144c-18-68 25-113 84-119 62-6 104 39 98 107-27-30-64-44-106-40-32 3-55 17-76 52z" fill="#f4f7fa"/>
  <path d="M113 60c-16-20-3-37 10-47 4 18 4 29-10 47m90-25c13-21 29-21 43-12-15 9-25 16-43 12" fill="#f4f7fa"/>

