  <path d="M204 158l17-11 17 11" fill="none" stroke="#24292f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="119" cy="181" rx="21" ry="10" fill="#e8a3aa" opacity=".42"/>
  <ellipse cx="244" cy="181" rx="21" ry="10" fill="#e8a3aa" opacity=".42"/>

  <!-- mouth -->
  <path d="M150 179q32 41 65 0c-2 39-15 58-33 58-19 0-30-20-32-58z" fill="#7d4e58" stroke="#4e343b" stroke-width="3"/>
  <ellipse cx="182" cy="218" rx="20" ry="8" fill="#e89da8"/>

  <!-- ahoge -->
  <path d="M174 46q4-29 27-32-9 15 8 27" fill="none" stroke="#f4f7fa" stroke-width="8" stroke-linecap="round"/>

