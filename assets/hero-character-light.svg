<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Eoncyrus — systems, agents, markets, information">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".58" stop-color="#f6f8fa"/>
    <stop offset="1" stop-color="#eef4f7"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#79c0ff"/>
    <stop offset=".5" stop-color="#56d4c8"/>
    <stop offset="1" stop-color="#b7a6ff"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>

<rect x="1" y="1" width="1278" height="438" rx="32" fill="url(#bg)" stroke="#d0d7de"/>
<circle cx="1090" cy="60" r="210" fill="#79c0ff" opacity=".035"/>
<circle cx="1000" cy="410" r="230" fill="#56d4c8" opacity=".028"/>
<circle cx="1170" cy="250" r="90" fill="#b7a6ff" opacity=".025"/>

<g opacity=".09" stroke="#afb8c1">
  <path d="M760 60H1220"/><path d="M760 110H1220"/><path d="M760 160H1220"/><path d="M760 210H1220"/><path d="M760 260H1220"/><path d="M760 310H1220"/><path d="M760 360H1220"/>
  <path d="M790 35V405"/><path d="M860 35V405"/><path d="M930 35V405"/><path d="M1000 35V405"/><path d="M1070 35V405"/><path d="M1140 35V405"/><path d="M1210 35V405"/>
</g>

<!-- logo -->
<g transform="translate(66,48)">
  <circle cx="30" cy="30" r="28" fill="#ffffff" stroke="#56d4c8" stroke-width="3"/>
