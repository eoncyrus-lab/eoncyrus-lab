<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Eoncyrus — quiet signal</title>
  <desc id="desc">A dark technical banner showing information moving through systems, agents, and decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d12"/>
      <stop offset="1" stop-color="#101a25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.5" stop-color="#56d4c8"/>
      <stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#c9d1d9" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="30" fill="url(#bg)" stroke="#283445" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="396" rx="29" fill="url(#grid)"/>
  <path d="M2 326C208 269 346 370 536 314S878 203 1278 259" fill="none" stroke="url(#accent)" stroke-opacity=".14" stroke-width="2"/>
  <path d="M2 328C208 271 346 372 536 316S878 205 1278 261" fill="none" stroke="#79c0ff" stroke-opacity=".1" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="72" y="72" fill="#8b949e" font-size="16" letter-spacing="1">eoncyrus-lab / profile</text>
    <text x="70" y="166" fill="#f0f6fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="750" letter-spacing="3">EONCYRUS</text>
    <text x="74" y="214" fill="#c9d1d9" font-size="22">tools for noisy systems</text>
    <rect x="74" y="245" width="498" height="2" fill="url(#accent)"/>
    <text x="74" y="286" fill="#79c0ff" font-size="15" letter-spacing="1">SIGNAL</text>
    <text x="171" y="286" fill="#56d4c8" font-size="15" letter-spacing="1">SYSTEMS</text>
    <text x="292" y="286" fill="#d2a8ff" font-size="15" letter-spacing="1">DECISIONS</text>
    <text x="74" y="333" fill="#8b949e" font-size="14">research · agents · automation</text>
  </g>

  <g transform="translate(736 72)">
    <rect x="0" y="0" width="472" height="254" rx="24" fill="#0d141d" fill-opacity=".86" stroke="#283445"/>
    <path d="M30 54H442M30 112H442M30 170H442" stroke="#c9d1d9" stroke-opacity=".09"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="30" y="30" fill="#8b949e" letter-spacing="1">A SMALL LOOP FOR BIG NOISE</text>
      <rect x="30" y="72" width="100" height="46" rx="12" fill="#111d2b" stroke="#79c0ff" stroke-width="2"/>
      <text x="80" y="100" text-anchor="middle" fill="#79c0ff">INPUT</text>
      <rect x="185" y="72" width="100" height="46" rx="12" fill="#111d2b" stroke="#56d4c8" stroke-width="2"/>
      <text x="235" y="100" text-anchor="middle" fill="#56d4c8">MODEL</text>
      <rect x="340" y="72" width="102" height="46" rx="12" fill="#111d2b" stroke="#d2a8ff" stroke-width="2"/>
      <text x="391" y="100" text-anchor="middle" fill="#d2a8ff">OUTPUT</text>
      <path d="M130 95H181M285 95H336" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
      <circle cx="83" cy="176" r="7" fill="#79c0ff"/>
      <circle cx="235" cy="176" r="7" fill="#56d4c8"/>
      <circle cx="391" cy="176" r="7" fill="#d2a8ff"/>
      <path d="M90 176H228M242 176H384" stroke="#8b949e" stroke-opacity=".6" stroke-width="2"/>
      <text x="30" y="216" fill="#8b949e">collect</text>
      <text x="204" y="216" fill="#8b949e">distill</text>
      <text x="368" y="216" fill="#8b949e">act</text>
    </g>
  </g>
</svg>
