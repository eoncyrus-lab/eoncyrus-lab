<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Eoncyrus — cyber silver signal</title>
  <desc id="desc">A dark cyber-technical banner showing code, markets, and long-horizon decisions moving through a small systems loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b12"/>
      <stop offset="1" stop-color="#151222"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ad8ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff9bd7"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a7b2c4" stroke-opacity=".06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#a9b4c5"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="30" fill="url(#bg)" stroke="#3a354b" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="396" rx="29" fill="url(#grid)"/>
  <path d="M2 326C208 269 346 370 536 314S878 203 1278 259" fill="none" stroke="url(#accent)" stroke-opacity=".16" stroke-width="2"/>
  <path d="M2 328C208 271 346 372 536 316S878 205 1278 261" fill="none" stroke="#7ad8ff" stroke-opacity=".09" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="72" y="72" fill="#a9b4c5" font-size="16" letter-spacing="1">eoncyrus-lab / cyber-silver</text>
    <text x="70" y="166" fill="#f3efff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="750" letter-spacing="3">EONCYRUS</text>
    <text x="74" y="214" fill="#d7d5e4" font-size="22">code for noisy markets</text>
    <rect x="74" y="245" width="498" height="2" fill="url(#accent)"/>
    <text x="74" y="286" fill="#7ad8ff" font-size="15" letter-spacing="1">CODE</text>
    <text x="160" y="286" fill="#6ee7d8" font-size="15" letter-spacing="1">MARKETS</text>
    <text x="292" y="286" fill="#ff9bd7" font-size="15" letter-spacing="1">SIGNALS</text>
    <text x="74" y="333" fill="#a9b4c5" font-size="14">agents · research · compound</text>
  </g>

  <g transform="translate(736 72)">
    <rect x="0" y="0" width="472" height="254" rx="24" fill="#11121d" fill-opacity=".9" stroke="#3a354b"/>
    <path d="M30 54H442M30 112H442M30 170H442" stroke="#d6d1e4" stroke-opacity=".09"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="30" y="30" fill="#a9b4c5" letter-spacing="1">BUILD / READ / COMPOUND</text>
      <rect x="30" y="72" width="100" height="46" rx="12" fill="#171827" stroke="#7ad8ff" stroke-width="2"/>
      <text x="80" y="100" text-anchor="middle" fill="#7ad8ff">BUILD</text>
      <rect x="185" y="72" width="100" height="46" rx="12" fill="#171827" stroke="#6ee7d8" stroke-width="2"/>
      <text x="235" y="100" text-anchor="middle" fill="#6ee7d8">READ</text>
      <rect x="340" y="72" width="102" height="46" rx="12" fill="#171827" stroke="#ff9bd7" stroke-width="2"/>
      <text x="391" y="100" text-anchor="middle" fill="#ff9bd7">COMPOUND</text>
      <path d="M130 95H181M285 95H336" stroke="#a9b4c5" stroke-width="2" marker-end="url(#arrow)"/>
      <circle cx="83" cy="176" r="7" fill="#7ad8ff"/>
      <circle cx="235" cy="176" r="7" fill="#6ee7d8"/>
      <circle cx="391" cy="176" r="7" fill="#ff9bd7"/>
      <path d="M90 176H228M242 176H384" stroke="#a9b4c5" stroke-opacity=".6" stroke-width="2"/>
      <text x="30" y="216" fill="#a9b4c5">ship</text>
      <text x="204" y="216" fill="#a9b4c5">study</text>
      <text x="368" y="216" fill="#a9b4c5">compound</text>
    </g>
  </g>
</svg>
